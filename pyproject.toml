[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wirescope"
version = "1.0.0"
description = "Lightweight PCAP Analysis & Network Forensics Toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yiğit Atmaca" }]
keywords = [
    "pcap",
    "network-forensics",
    "packet-analysis",
    "incident-response",
    "ctf",
    "security",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.5.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
wirescope = "wirescope.cli:app"

[project.urls]
Homepage = "https://github.com/yigitatmaca42/WireScope"
Issues = "https://github.com/yigitatmaca42/WireScope/issues"

[tool.setuptools.packages.find]
include = ["wirescope*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
